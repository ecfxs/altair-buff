name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      # release 构建用工作区内的 keystore 签名（签名配置在 probe/build.gradle.kts 里）
      - name: 构建 release APK
        run: ./gradlew :probe:assembleRelease --no-daemon --stacktrace

      - name: 确认产物存在
        run: |
          ls -lh probe/build/outputs/apk/release/
          test -f probe/build/outputs/apk/release/probe-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: probe-release-apk
          path: probe/build/outputs/apk/release/probe-release.apk
